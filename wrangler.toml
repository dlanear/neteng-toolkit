name = "neteng-toolkit"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# Cloudflare Pages Functions live in /functions (repo root) and are picked up
# automatically — no additional configuration needed here.
#
# Local development:
#   npm run build           # generates /public from /src
#   npx wrangler pages dev public --compatibility-date=2024-09-23
#
# Deployment (via Cloudflare dashboard "Connect to Git"):
#   Build command:    npm run build
#   Build output dir: public
#
# Deployment (via CLI):
#   npx wrangler pages deploy public --project-name=neteng-toolkit
